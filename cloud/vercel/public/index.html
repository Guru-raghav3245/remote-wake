<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>Remote Wake</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#6b6b76; --card:#f3f3f6; --ac:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0f; --fg:#f2f2f5; --mut:#9a9aa6; --card:#17171d; --ac:#4f8cff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif; padding:max(16px, env(safe-area-inset-top)) 16px 32px; }
  main { max-width:420px; margin:0 auto; }
  h1 { font-size:22px; margin:24px 0 4px; }
  p { color:var(--mut); margin:4px 0 16px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
  input { width:100%; font:600 26px ui-monospace, monospace; letter-spacing:.15em; text-align:center; text-transform:uppercase; padding:14px; border-radius:12px; border:1px solid var(--mut); background:var(--bg); color:var(--fg); }
  button { width:100%; font:600 18px inherit; padding:16px; border:0; border-radius:14px; background:var(--ac); color:#fff; margin-top:12px; }
  button:disabled { opacity:.5; }
  button.link { background:none; color:var(--mut); font-size:14px; padding:8px; }
  .row { display:flex; justify-content:space-between; padding:4px 0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #steps div { padding:4px 0; color:var(--mut); } #steps .done { color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Remote Wake</h1>
  <div id="pair" hidden>
    <p>Open Remote Wake on your Mac and enter the pairing code it shows.</p>
    <div class="card"><input id="code" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" inputmode="text"><button id="go">Pair</button></div>
  </div>
  <div id="home" hidden>
    <p id="name"></p>
    <div class="card">
      <div class="row"><span>Mac</span><b id="state"></b></div>
      <div class="row"><span>Last check-in</span><span id="last"></span></div>
      <div class="row"><span>Power</span><span id="power"></span></div>
    </div>
    <button id="wake">Wake my Mac</button>
    <div class="card" id="steps" hidden style="margin-top:16px"><div id="s1">Request sent</div><div id="s2">Mac received it</div><div id="s3">Mac is awake</div></div>
    <button class="link" id="unpair">Unpair this phone</button>
  </div>
  <p id="msg" class="bad"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const get = () => { try { return JSON.parse(localStorage.getItem('rw') || 'null'); } catch { return null; } };
let auth = get(), poll = null, statusTimer = null;
const msg = (t) => ($('msg').textContent = t || '');
async function api(method, path, body, token) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Error ' + r.status), { status: r.status });
  return j;
}
const ago = (t) => { if (!t) return 'never'; const s = Math.round(Date.now() / 1000 - t); return s < 90 ? s + ' s ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago'; };

function show() {
  $('pair').hidden = !!auth; $('home').hidden = !auth;
  clearInterval(statusTimer);
  if (auth) { $('name').textContent = auth.name || 'Your Mac'; refresh(); statusTimer = setInterval(refresh, 10000); }
}
async function refresh() {
  try {
    const d = await api('GET', '/device', null, auth.token);
    $('state').textContent = d.no_recent_checkin ? 'No recent check-in' : 'Reachable'; $('state').className = d.no_recent_checkin ? 'bad' : 'ok';
    $('last').textContent = ago(d.last_checkin);
    $('power').textContent = (d.power || '?') + (d.battery !== null && d.battery !== undefined ? ' ' + d.battery + '%' : '');
    msg();
  } catch (e) { if (e.status === 401) unpair(); else msg('Cannot reach the server.'); }
}
function unpair() { localStorage.removeItem('rw'); auth = null; show(); }

$('go').onclick = async () => {
  $('go').disabled = true; msg();
  try {
    const p = await api('POST', '/pair', { code: $('code').value });
    auth = { token: p.phone_token, name: p.name }; localStorage.setItem('rw', JSON.stringify(auth)); show();
  } catch (e) { msg(e.status === 404 ? 'That code is wrong or expired. Get a new one on your Mac.' : e.message); }
  $('go').disabled = false;
};
$('unpair').onclick = unpair;
$('wake').onclick = async () => {
  $('wake').disabled = true; msg(); clearInterval(poll);
  const mark = (n) => { for (const i of [1, 2, 3]) $('s' + i).className = i <= n ? 'done' : ''; };
  try {
    const w = await api('POST', '/wake', null, auth.token);
    $('steps').hidden = false; mark(1);
    poll = setInterval(async () => {
      try {
        const r = await api('GET', '/request/' + w.id, null, auth.token);
        mark({ waiting: 1, acked: 2, online: 3 }[r.state] || 1);
        if (r.state === 'online' || r.state === 'expired') { clearInterval(poll); $('wake').disabled = false; if (r.state === 'expired') msg('The Mac did not respond in time.'); }
      } catch { clearInterval(poll); $('wake').disabled = false; }
    }, 3000);
  } catch (e) { msg(e.status === 429 ? 'Too many wake requests, wait a minute.' : e.message); $('wake').disabled = false; }
};
show();
</script>
</body>
</html>
